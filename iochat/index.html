<!DOCTYPE html>
<html>
<head>
    <title>IO Chat</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin-top: 30px; }
        #messageArea { display: none; } /* Disembunyikan sebelum user login */
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Form Pendaftaran Username -->
        <div id="userFormArea" class="row">
            <div class="col-md-12">
                <form id="userForm">
                    <div class="form-group">
                        <label>Enter Username</label>
                        <input class="form-control" id="username" />
                        <br />
                        <input type="submit" class="btn btn-primary" value="Login" />
                    </div>
                </form>
            </div>
        </div>

        <!-- Area Chat Utama -->
        <div id="messageArea" class="row">
            <!-- Sidebar User Online -->
            <div class="col-md-4">
                <div class="well">
                    <h3>Online Users</h3>
                    <ul class="list-group" id="users"></ul>
                </div>
            </div>
            
            <!-- Daftar Pesan & Form Kirim -->
            <div class="col-md-8">
                <div class="chat" id="chat"></div>
                
                <form id="messageForm">
                    <div class="form-group">
                        <label>Enter Message</label>
                        <textarea class="form-control" id="message"></textarea>
                        <br />
                        <input type="submit" class="btn btn-primary" value="Send Message" />
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- Logika Client-Side dengan jQuery & Socket.io -->
    <script>
        $(function(){
            var socket = io.connect();
            var $messageForm = $('#messageForm');
            var $message = $('#message');
            var $chat = $('#chat');
            var $messageArea = $('#messageArea');
            var $userFormArea = $('#userFormArea');
            var $userForm = $('#userForm');
            var $users = $('#users');
            var $username = $('#username');

            // Mendaftarkan Pesan
            $messageForm.submit(function(e){
                e.preventDefault();
                socket.emit('send message', $message.val());
                $message.val('');
            });

            // Menampilkan Pesan Baru di Layar
            socket.on('new message', function(data){
                $chat.append('<div class="well"><strong>' + data.user + ': </strong>' + data.msg + '</div>');
            });

            // Pendaftaran User Baru
            $userForm.submit(function(e){
                e.preventDefault();
                socket.emit('new user', $username.val(), function(data){
                    if(data){
                        $userFormArea.hide();
                        $messageArea.show();
                    }
                });
                $username.val('');
            });

            // Update List User Online
            socket.on('get users', function(data){
                var html = '';
                for(var i = 0; i < data.length; i++){
                    html += '<li class="list-group-item">' + data[i] + '</li>';
                }
                $users.html(html);
            });
        });
    </script>
</body>
</html>
